name: secret-scan

# Layer 3 of defense in depth: the machine-independent, un-bypassable CI check.
# Runs the same tool (gitleaks) as the local pre-commit hook, but server-side on
# every push and pull request, so it applies no matter whose machine pushed.
on:
  push:
  pull_request:

# Least privilege: this job only needs to read the code it scans.
permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      # Pinned to match the local hook's version today. Parity is maintained, not free:
      # if brew bumps the local gitleaks, update this too (or treat CI as source of truth).
      GITLEAKS_VERSION: "8.30.1"
      # Baked-in checksum. The download is verified against this and fails closed on
      # mismatch, so a corrupted or man-in-the-middled binary cannot run.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      # Pinned to a commit SHA, not a tag, so the reference cannot be repointed under us.
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install pinned gitleaks, verified by checksum
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          curl -fsSL "$url" -o "$asset"
          echo "${GITLEAKS_SHA256}  ${asset}" | sha256sum -c -
          tar -xzf "$asset" gitleaks
          ./gitleaks version

      - name: Scan full git history for secrets
        run: |
          set -euo pipefail
          ./gitleaks git . --redact
